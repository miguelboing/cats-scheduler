name: cppcheck-action-test

on:
  push:
    branches:
      - dev
      - main
  pull_request_target:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  build:
    name: cppcheck-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cppcheck
        uses: deep5050/cppcheck-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          force_language: c++
          enable: warning,style,performance,portability

          other_options: --error-exitcode=1 -I$PWD --inline-suppr --suppress=unusedFunction --suppress=useStlAlgorithm

      - name: Display cppcheck report
        if: always()
        run: |
          if [ -f cppcheck_report.txt ]; then
            echo "=== Cppcheck Report ==="
            cat cppcheck_report.txt
          else
            echo "No cppcheck report found"
          fi
